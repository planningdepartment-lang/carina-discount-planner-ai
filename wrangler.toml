name = "carina-discount-planner-ai"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding (Default / Production)
[[d1_databases]]
binding = "DB"
database_name = "odoo-report-db-ksa"
database_id = "7cf6d49e-e9cc-421b-8a80-b63af95bb063"

# Cloudflare Workers AI Binding (Default / Production)
[ai]
binding = "AI"

# Environment Variables & AI Gateway
[vars]
AI_GATEWAY_ID = "carina-ai-gateway"
LORA_ADAPTER_NAME = "carina-retail-v1"

# Static Assets for Pages Dashboard with Worker Route Guard
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Development Environment
[env.dev]
name = "carina-discount-planner-ai-dev"

[env.dev.vars]
AI_GATEWAY_ID = "carina-ai-gateway"
LORA_ADAPTER_NAME = "carina-retail-v1"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "odoo-report-db-ksa"
database_id = "7cf6d49e-e9cc-421b-8a80-b63af95bb063"

[env.dev.ai]
binding = "AI"

[env.dev.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
