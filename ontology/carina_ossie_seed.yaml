# CARINA Retail Merchandising Semantic Ontology (Apache Ossie-Compatible Seed)
# Compatible with NVIDIA/auto-ontology import/export and compiled to src/ai/ontology/compiledOntology.ts
version: "1.0.0"
name: "carina-ksa-merchandising-ontology"
dialect: "sqlite"
description: "Certified semantic layer for CARINA KSA retail inventory, pricing, Saudi 15% VAT zero-loss compliance, and store floor density."

governance:
  excludedLocations:
    - "Shofy/Stock"
    - "WH-D/Stock"
    - "Virtual Locations/*"
  blockedTables:
    - "admin_users"
    - "admin_sessions"
    - "copilot_feedback"
    - "plan_audit_log"
    - "sqlite_master"
    - "sqlite_schema"
  maxQueryRows: 50
  vatRate: 0.15
  stores:
    - code: "AND/Stock"
      name: "Al-Andalus Mall Flagship"
      city: "Jeddah"
      areaM2: 260
      stockColumn: "stock_andalus"
    - code: "YAS/Stock"
      name: "Al-Yasmeen Mall"
      city: "Jeddah"
      areaM2: 193
      stockColumn: "stock_yasmeen"
    - code: "Jouri/Stock"
      name: "Jouri Mall"
      city: "Taif"
      areaM2: 168
      stockColumn: "stock_jouri"
    - code: "WH/Stock"
      name: "Central Warehouse"
      city: "Central"
      areaM2: 0
      stockColumn: "stock_wh"

unguidedMetrics:
  - id: "return_rate"
    pattern: "return rate|returns rate|customer return|refund rate"
    label: "Customer Return Rate"
  - id: "sentiment_score"
    pattern: "happiness|sentiment score|sentiment index|nps|net promoter"
    label: "Customer Sentiment / NPS"
  - id: "social_buzz"
    pattern: "social media|instagram|tiktok|impressions|viral|social buzz"
    label: "Social Media Engagement"
  - id: "web_funnel"
    pattern: "bounce rate|click through|ctr|page views"
    label: "Web Funnel Telemetry"
  - id: "urgency_index"
    pattern: "urgency factor|urgency index|brand equity"
    label: "Unguided Brand / Urgency Index"

tables:
  - name: "style_plan_snapshots"
    access: "public_readonly"
    description: "Pre-aggregated master merchandising snapshot per 5-digit style code across physical KSA stores and WH. Live category values include: Set (pyjamas/sets), Socks, Top, Bra, Pant, Towel, Night Gown, Panty, Dress, T-Shirt, Shirt, Cosmetics, Short, Robe, Corset, Panty Hose, Brief 5PCS, Bikini 5PCS, Sheets, Body, Kimono, Scarf."
    primaryKey: "style_code"
    columns:
      - "style_code"
      - "product_name"
      - "category"
      - "season"
      - "total_physical_stock"
      - "stock_andalus"
      - "stock_yasmeen"
      - "stock_jouri"
      - "stock_wh"
      - "cumulative_str_pct"
      - "weekly_ros"
      - "weekly_ros_2wk"
      - "weekly_ros_4wk"
      - "momentum_ratio"
      - "momentum_label"
      - "store_floor_wos"
      - "sar_curve_health"
      - "active_size_count"
      - "has_core_sizes"
      - "is_single_size"
      - "unit_cost"
      - "cost_plus_vat"
      - "ticket_price"
      - "recommended_offer"
      - "promotional_price"
      - "discount_pct"
      - "zero_loss_status"
      - "forecast_sold"
      - "forecast_profit"
      - "post_event_stock"
      - "lifecycle_tier"
      - "commercial_rationale"
      - "is_manual_override"
      - "sold_units"
      - "sales_lifecycle_weeks"
      - "first_move_date"

  - name: "business_rules"
    access: "public_readonly"
    description: "Active commercial governance rules (MARGIN, DISCOUNT_CAP, EXCLUSION, STOCK_TARGET)."
    primaryKey: "rule_id"
    columns:
      - "rule_id"
      - "rule_name"
      - "rule_category"
      - "target_scope"
      - "condition_operator"
      - "rule_value"
      - "enforcement_level"
      - "is_active"

  - name: "post_promo_monitoring"
    access: "public_readonly"
    description: "Post-campaign daily sales velocity and lift alerts per style."
    primaryKey: "id"
    columns:
      - "id"
      - "style_code"
      - "audit_date"
      - "units_sold_today"
      - "cumulative_sold_post_launch"
      - "pre_promo_baseline_ros"
      - "observed_lift_multiplier"
      - "alert_status"

  - name: "system_settings"
    access: "public_readonly"
    description: "Workspace configuration such as ACTIVE_CAMPAIGN_MODE."
    primaryKey: "key"
    columns:
      - "key"
      - "value"
      - "updated_at"

terms:
  - id: "physical_stock"
    name: "Total Physical Stock"
    synonyms:
      - "physical stock"
      - "on-hand"
      - "on hand"
      - "total stock"
      - "inventory"
      - "units"
      - "stock"
    definition: "Sum of physical units across Al-Andalus, Al-Yasmeen, Jouri Mall, and Central Warehouse. Excludes Shofy/Stock and WH-D/Stock."
    table: "style_plan_snapshots"
    columns:
      - "total_physical_stock"
    sqlExpression: "total_physical_stock"
    unit: "units"
    governanceNote: "Never includes Shofy/Stock phantom e-commerce inventory."

  - id: "store_floor_stock"
    name: "Retail Store Floor Stock"
    synonyms:
      - "floor stock"
      - "store stock"
      - "branch stock"
      - "retail doors"
      - "door stock"
    definition: "Combined on-hand stock across the 3 physical retail branches (excluding Central Warehouse)."
    table: "style_plan_snapshots"
    columns:
      - "stock_andalus"
      - "stock_yasmeen"
      - "stock_jouri"
    sqlExpression: "(stock_andalus + stock_yasmeen + stock_jouri)"
    unit: "units"
    governanceNote: "Used for Store Floor WOS and rack density."

  - id: "andalus_stock"
    name: "Al-Andalus Mall Flagship Stock"
    synonyms:
      - "andalus"
      - "al-andalus"
      - "flagship"
      - "jeddah flagship"
    definition: "Physical inventory at Al-Andalus Mall Flagship (Jeddah, 260 m²)."
    table: "style_plan_snapshots"
    columns:
      - "stock_andalus"
    sqlExpression: "stock_andalus"
    unit: "units"
    governanceNote: "Floor area = 260 m²; target density 25-35 u/m²."

  - id: "yasmeen_stock"
    name: "Al-Yasmeen Mall Stock"
    synonyms:
      - "yasmeen"
      - "al-yasmeen"
      - "north jeddah"
    definition: "Physical inventory at Al-Yasmeen Mall (Jeddah, 193 m²)."
    table: "style_plan_snapshots"
    columns:
      - "stock_yasmeen"
    sqlExpression: "stock_yasmeen"
    unit: "units"
    governanceNote: "Floor area = 193 m²; high-density store target <= 34.0 u/m²."

  - id: "jouri_stock"
    name: "Jouri Mall Stock (Taif)"
    synonyms:
      - "jouri"
      - "taif"
      - "jouri mall"
    definition: "Physical inventory at Jouri Mall (Taif, 168 m²)."
    table: "style_plan_snapshots"
    columns:
      - "stock_jouri"
    sqlExpression: "stock_jouri"
    unit: "units"
    governanceNote: "Floor area = 168 m²; colder mountain climate, target <= 35.0 u/m²."

  - id: "warehouse_stock"
    name: "Central Warehouse Reserve"
    synonyms:
      - "warehouse"
      - "wh"
      - "central warehouse"
      - "reserve"
      - "backstock"
    definition: "Reserve replenishment inventory held in Central Warehouse (WH/Stock)."
    table: "style_plan_snapshots"
    columns:
      - "stock_wh"
    sqlExpression: "stock_wh"
    unit: "units"
    governanceNote: "Reserve buffer; not on retail selling floor."

  - id: "landed_unit_cost"
    name: "Landed Unit Cost (COGS)"
    synonyms:
      - "cost"
      - "unit cost"
      - "cogs"
      - "landed cost"
    definition: "Landed acquisition cost per unit in SAR (ex-VAT)."
    table: "style_plan_snapshots"
    columns:
      - "unit_cost"
    sqlExpression: "unit_cost"
    unit: "SAR"
    governanceNote: "Base input for Saudi 15% VAT zero-loss floor."

  - id: "saudi_vat_floor"
    name: "Saudi 15% VAT Zero-Loss Floor"
    synonyms:
      - "vat floor"
      - "zero-loss floor"
      - "zero loss"
      - "legal floor"
      - "break-even"
      - "breakeven"
      - "minimum price"
    definition: "Legal minimum VAT-inclusive promotional selling price: Landed Unit Cost * 1.15."
    table: "style_plan_snapshots"
    columns:
      - "cost_plus_vat"
      - "unit_cost"
    sqlExpression: "ROUND(unit_cost * 1.15, 2)"
    unit: "SAR"
    governanceNote: "Hard regulatory floor; promotional_price must always be >= unit_cost * 1.15."

  - id: "capital_tied_up"
    name: "Inventory Cost Capital Tied Up"
    synonyms:
      - "capital"
      - "cost capital"
      - "capital tied up"
      - "inventory value at cost"
      - "cogs value"
      - "tied up"
    definition: "Total acquisition capital locked in on-hand physical stock (total_physical_stock * unit_cost)."
    table: "style_plan_snapshots"
    columns:
      - "total_physical_stock"
      - "unit_cost"
    sqlExpression: "ROUND(SUM(total_physical_stock * unit_cost), 2)"
    unit: "SAR"
    governanceNote: "Measures working capital recoverable via targeted liquidation."

  - id: "retail_ticket_value"
    name: "Retail Ticket Valuation"
    synonyms:
      - "retail value"
      - "ticket value"
      - "ticket price"
      - "list price"
    definition: "Full-price VAT-inclusive retail value of on-hand stock (total_physical_stock * ticket_price)."
    table: "style_plan_snapshots"
    columns:
      - "total_physical_stock"
      - "ticket_price"
    sqlExpression: "ROUND(SUM(total_physical_stock * ticket_price), 2)"
    unit: "SAR"
    governanceNote: "Full-ticket valuation before promotional markdowns."

  - id: "weekly_ros"
    name: "8-Week Rolling Velocity (ROS)"
    synonyms:
      - "ros"
      - "velocity"
      - "rate of sale"
      - "sales rate"
      - "selling speed"
      - "slow movers"
      - "fast movers"
    definition: "Average units sold per week over the rolling 8-week active baseline."
    table: "style_plan_snapshots"
    columns:
      - "weekly_ros"
    sqlExpression: "weekly_ros"
    unit: "units/week"
    governanceNote: "Baseline demand speed metric for forecasting and clearance triage."

  - id: "velocity_momentum"
    name: "Recent 2-Week Velocity Momentum"
    synonyms:
      - "momentum"
      - "accelerating"
      - "decelerating"
      - "2-week ros"
      - "recent velocity"
      - "trending"
    definition: "Ratio of recent 2-week ROS (weekly_ros_2wk) to 8-week baseline ROS (momentum_ratio)."
    table: "style_plan_snapshots"
    columns:
      - "weekly_ros_2wk"
      - "momentum_ratio"
      - "momentum_label"
    sqlExpression: "momentum_ratio"
    unit: "ratio"
    governanceNote: "momentum_ratio > 1.2 indicates accelerating demand even on mature stock."

  - id: "store_floor_wos"
    name: "Store Floor Weeks of Supply (WOS / Runway)"
    synonyms:
      - "wos"
      - "runway"
      - "weeks of supply"
      - "coverage"
      - "overstock"
      - "overstocked"
    definition: "Weeks required to sell through retail store floor stock at current 8-week weekly ROS."
    table: "style_plan_snapshots"
    columns:
      - "store_floor_wos"
      - "weekly_ros"
    sqlExpression: "store_floor_wos"
    unit: "weeks"
    governanceNote: "WOS > 26-32 weeks signals overstock bottleneck."

  - id: "cumulative_str"
    name: "Cumulative Sell-Through Rate (STR %)"
    synonyms:
      - "str"
      - "sell-through"
      - "sell through"
      - "adoption"
    definition: "Percentage of lifetime received inventory already sold."
    table: "style_plan_snapshots"
    columns:
      - "cumulative_str_pct"
    sqlExpression: "cumulative_str_pct"
    unit: "%"
    governanceNote: "Combines with tenure weeks to qualify Hero vs Clearance tiers."

  - id: "size_curve_health"
    name: "Size Curve Health & Single-Size Status"
    synonyms:
      - "size curve"
      - "curve"
      - "broken curve"
      - "healthy curve"
      - "core sizes"
      - "oddment"
      - "single size"
      - "sizes"
    definition: "Assesses whether sized apparel retains core S/M/L/XL (>=2u each) vs broken curves or valid Single-Size (Complete) non-sized items."
    table: "style_plan_snapshots"
    columns:
      - "sar_curve_health"
      - "has_core_sizes"
      - "is_single_size"
      - "active_size_count"
    sqlExpression: "sar_curve_health"
    unit: "classification"
    governanceNote: "Single-size cosmetics/socks/accessories (is_single_size = 1) are NEVER broken curves."

  - id: "promo_net_margin_unit"
    name: "Promotional Unit Net Margin (Ex-VAT)"
    synonyms:
      - "net margin"
      - "margin"
      - "profit per unit"
      - "unit margin"
      - "profitability"
    definition: "Net cash margin per unit at promotional price after stripping 15% Saudi VAT: (promotional_price / 1.15) - unit_cost."
    table: "style_plan_snapshots"
    columns:
      - "promotional_price"
      - "unit_cost"
    sqlExpression: "ROUND((promotional_price / 1.15) - unit_cost, 2)"
    unit: "SAR/unit"
    governanceNote: "Must remain >= 0 for zero-loss compliance."

  - id: "forecast_net_profit"
    name: "Forecast Event Net Profit & Clearance"
    synonyms:
      - "forecast profit"
      - "net profit"
      - "projected profit"
      - "forecast sold"
      - "clearance yield"
    definition: "Projected units sold and net cash profit contribution under the recommended offer."
    table: "style_plan_snapshots"
    columns:
      - "forecast_sold"
      - "forecast_profit"
      - "post_event_stock"
    sqlExpression: "SUM(forecast_profit)"
    unit: "SAR"
    governanceNote: "Ex-VAT profit contribution after COGS."

  - id: "lifecycle_offer_tier"
    name: "Lifecycle Tier & Recommended Offer"
    synonyms:
      - "tier"
      - "lifecycle"
      - "offer"
      - "discount"
      - "clearance"
      - "hero"
      - "winter"
      - "full price"
      - "bundle"
    definition: "Deterministic merchandising tier and promotional mechanic assigned per style."
    table: "style_plan_snapshots"
    columns:
      - "lifecycle_tier"
      - "recommended_offer"
      - "promotional_price"
      - "discount_pct"
      - "zero_loss_status"
    sqlExpression: "lifecycle_tier"
    unit: "tier"
    governanceNote: "Tiers include HERO_CORE, FRESH_WINTER, BUNDLE_2, CLEARANCE_3_FOR_99, CLEARANCE_50_PCT."

  - id: "store_density"
    name: "Store Floor Stock Density (u/m²)"
    synonyms:
      - "density"
      - "units per sqm"
      - "u/m2"
      - "sqm"
      - "space"
      - "bottleneck"
      - "congestion"
    definition: "Units on store floor divided by branch area: Andalus / 260, Yasmeen / 193, Jouri / 168."
    table: "style_plan_snapshots"
    columns:
      - "stock_andalus"
      - "stock_yasmeen"
      - "stock_jouri"
    sqlExpression: "ROUND(SUM(stock_jouri) / 168.0, 1)"
    unit: "u/m²"
    governanceNote: "Target <= 35 u/m² in Al-Yasmeen and Jouri Mall."

  - id: "governance_rules"
    name: "Active Commercial Governance Rules"
    synonyms:
      - "rules"
      - "policies"
      - "governance"
      - "caps"
      - "exclusions"
    definition: "Dynamic policy constraints stored in business_rules table."
    table: "business_rules"
    columns:
      - "rule_id"
      - "rule_name"
      - "rule_category"
      - "target_scope"
      - "condition_operator"
      - "rule_value"
      - "enforcement_level"
      - "is_active"
    sqlExpression: "SELECT rule_id, rule_name, rule_category, target_scope, condition_operator, rule_value, enforcement_level FROM business_rules WHERE is_active = 1"
    unit: "policy"
    governanceNote: "HARD_BLOCK rules cannot be overridden."

  - id: "post_promo_alerts"
    name: "Post-Promo Lift & Stall Alerts"
    synonyms:
      - "monitoring"
      - "lift"
      - "promo stall"
      - "early sellout"
      - "post promo"
      - "alerts"
    definition: "Daily post-launch sales lift tracking against pre-promo baseline ROS."
    table: "post_promo_monitoring"
    columns:
      - "style_code"
      - "audit_date"
      - "units_sold_today"
      - "observed_lift_multiplier"
      - "alert_status"
    sqlExpression: "alert_status"
    unit: "alert"
    governanceNote: "Flags PROMO_STALL or EARLY_SELLOUT anomalies."

  - id: "speed_band_classification"
    name: "Speed Band Classification (FAST / MEDIUM / SLOW)"
    synonyms:
      - "slow"
      - "med"
      - "medium"
      - "fast"
      - "speed"
      - "speed band"
      - "fast mover"
      - "slow mover"
      - "hero"
    definition: "CARINA drop-cycle velocity classification: FAST_HERO (>= 2.5 u/wk ROS & <= 12 WOS, or >= 1.5 u/wk & <= 16 WOS for single-size items), MEDIUM (>= 0.8 u/wk & <= 32 WOS), SLOW (< 0.8 u/wk or overstocked > 26-32 WOS)."
    table: "style_plan_snapshots"
    columns:
      - "weekly_ros"
      - "weekly_ros_2wk"
      - "store_floor_wos"
      - "cumulative_str_pct"
      - "sales_lifecycle_weeks"
      - "is_single_size"
      - "has_core_sizes"
    sqlExpression: "CASE WHEN (is_single_size = 1 AND weekly_ros >= 1.5 AND store_floor_wos <= 16) OR (weekly_ros >= 2.5 AND store_floor_wos <= 12) THEN 'FAST_HERO' WHEN weekly_ros >= 0.8 AND store_floor_wos <= 32 THEN 'MEDIUM' ELSE 'SLOW' END"
    unit: "speed_band"
    governanceNote: "Use evaluateSpeedAndHeroQualification thresholds; store_floor_wos determines floor runway while WH buffer adds network coverage."

sqlAttributes:
  - id: "network_store_density_summary"
    description: "Current total stock and units/m² density across Al-Andalus (260m²), Al-Yasmeen (193m²), Jouri (168m²), and Central WH."
    sql: "SELECT SUM(stock_andalus) AS andalus_units, ROUND(SUM(stock_andalus)/260.0, 1) AS andalus_u_m2, SUM(stock_yasmeen) AS yasmeen_units, ROUND(SUM(stock_yasmeen)/193.0, 1) AS yasmeen_u_m2, SUM(stock_jouri) AS jouri_units, ROUND(SUM(stock_jouri)/168.0, 1) AS jouri_u_m2, SUM(stock_wh) AS wh_units, SUM(total_physical_stock) AS total_units FROM style_plan_snapshots"

  - id: "category_capital_and_profit_breakdown"
    description: "Category-level style count, physical units, tied-up cost capital, and forecast net profit."
    sql: "SELECT COALESCE(category, 'General') AS category, COUNT(*) AS styles, SUM(total_physical_stock) AS total_units, ROUND(SUM(total_physical_stock * unit_cost), 0) AS capital_sar, ROUND(AVG(store_floor_wos), 1) AS avg_wos, ROUND(SUM(forecast_profit), 0) AS forecast_profit_sar FROM style_plan_snapshots GROUP BY category ORDER BY capital_sar DESC LIMIT 25"

  - id: "broken_curve_capital_summary"
    description: "Capital tied up and stock distribution for sized apparel with broken size curves (excluding single-size complete items)."
    sql: "SELECT COALESCE(category, 'General') AS category, COUNT(*) AS styles, SUM(total_physical_stock) AS units, ROUND(SUM(total_physical_stock * unit_cost), 0) AS capital_sar, ROUND(AVG(discount_pct), 1) AS avg_discount_pct FROM style_plan_snapshots WHERE is_single_size = 0 AND (has_core_sizes = 0 OR sar_curve_health LIKE '%Broken%') GROUP BY category ORDER BY capital_sar DESC LIMIT 25"

  - id: "warehouse_trapped_store_starved"
    description: "Styles with zero or low store floor stock but substantial Central Warehouse (WH) reserve ready for replenishment."
    sql: "SELECT style_code, product_name, category, stock_andalus, stock_yasmeen, stock_jouri, stock_wh, weekly_ros, recommended_offer FROM style_plan_snapshots WHERE stock_wh >= 20 AND (stock_andalus + stock_yasmeen + stock_jouri) <= 5 ORDER BY stock_wh DESC LIMIT 20"

  - id: "accelerating_momentum_discounted"
    description: "Styles currently marked for discount despite accelerating 2-week sales momentum (momentum_ratio >= 1.2)."
    sql: "SELECT style_code, product_name, category, weekly_ros, weekly_ros_2wk, momentum_ratio, discount_pct, recommended_offer, store_floor_wos FROM style_plan_snapshots WHERE momentum_ratio >= 1.2 AND discount_pct > 0 ORDER BY momentum_ratio DESC LIMIT 20"
